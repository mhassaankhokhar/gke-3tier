# Runs the load test inside the cluster and the mesh: the app namespace is
# STRICT mTLS behind deny-all, so the generator needs a sidecar. Stateful pool,
# so it doesn't compete with the spot tiers under test. The k6 ServiceAccount and
# AuthorizationPolicy live in gke-3tier-gitops (overlays/loadtest).
#
#   kubectl create configmap k6-script --from-file=load.js=loadtest/load.js -n app --dry-run=client -o yaml | kubectl apply -f -
#   kubectl apply -f loadtest/k6-job.yaml
#   kubectl logs -f job/k6 -n app
#   kubectl delete -f loadtest/k6-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: k6
  namespace: app
spec:
  backoffLimit: 0
  template:
    metadata:
      annotations:
        # Shuts the sidecar down when k6 exits, so the Job can complete.
        sidecar.istio.io/inject: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: k6
      nodeSelector:
        workload: stateful
      containers:
        - name: k6
          image: grafana/k6:1.4.0
          args: ["run", "/scripts/load.js"]
          env:
            - name: SCENARIO
              value: "capacity"
            # Direct to the web Service, bypassing the gateway: measures the app, not TLS termination.
            - name: BASE_URL
              value: "http://web.app.svc.cluster.local"
          volumeMounts:
            - name: script
              mountPath: /scripts
          resources:
            # Memory scales with maxVUs. CPU request is what the stable nodes can fit; no
            # CPU limit, because a throttled generator reports the app as slow.
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
      volumes:
        - name: script
          configMap:
            name: k6-script
