# The ExternalSecret objects themselves — wave -1, after the operator's CRDs
# exist (wave -3) and before anything that reads the resulting Secret.
#
# Kept in this repo rather than a chart because they are three small objects
# specific to this cluster, and wrapping them in a chart would add a layer with
# nothing in it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/mhassaankhokhar/gke-3tier.git
    targetRevision: main
    path: manifests/external-secrets
  destination:
    server: https://kubernetes.default.svc
    # Namespace here is only the default for objects that do not set their own;
    # each ExternalSecret names its own namespace.
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
