name: Validate

# Credential-free checks (fmt, validate, scan, app builds), so forks can run it too.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3

      - name: Format check
        run: terraform fmt -check -recursive terraform/

      # Modules on their own as well, so a module broken outside this env is caught.
      - name: Validate modules
        run: |
          for dir in terraform/modules/*/; do
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

      # -backend=false: validate needs providers, not state. envs/*/ picks up new environments.
      - name: Validate bootstrap and environments
        run: |
          for dir in terraform/bootstrap terraform/envs/*/; do
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

  tfsec:
    name: Terraform static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Report-only: deliberate trade-offs (zonal cluster, open control-plane CIDR) are flagged HIGH.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

  app:
    name: ${{ matrix.service }} build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.service }}
        run: npm ci

      # No test scripts yet, so this checks the code parses: node --check for the
      # api, a bundle build for web (a Vite app with no app.js).
      - name: Smoke check
        working-directory: ${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "web" ]; then
            npm run build
          else
            node --check app.js
          fi

      # Build only, no registry login.
      - name: Docker build
        run: docker build -t ${{ matrix.service }}:ci ${{ matrix.service }}/
