# Builds and pushes the images, then writes the new tag into gke-3tier-gitops;
# Argo CD rolls it out. CI holds no cluster credentials. The tag lives in a
# separate repo so a deploy commit doesn't re-trigger this workflow.
name: Build

on:
  push:
    branches: [main]
    # App changes only.
    paths:
      - "web/**"
      - "api/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  # Federation, as in terraform.yml: no service account key.
  id-token: write

env:
  REGISTRY: us-central1-docker.pkg.dev
  # One Artifact Registry repository; images are paths within it.
  AR_REPO: gke-3tier

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, api]
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          # Commit SHA only, no `latest`: the cluster must run exactly what Git names.
          tags: ${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Update GitOps
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the GitOps repository
        uses: actions/checkout@v7
        with:
          repository: mhassaankhokhar/gke-3tier-gitops
          # Write-only deploy key, separate from Argo CD's read-only key.
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          path: gitops

      - uses: imranismail/setup-kustomize@v2

      - name: Point the overlay at the new images
        working-directory: gitops/manifests/app/overlays/dev
        run: |
          kustomize edit set image \
            web=${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/web:${{ github.sha }} \
            api=${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/api:${{ github.sha }}

      - name: Commit and push
        working-directory: gitops
        run: |
          git config user.name  "gke-3tier build"
          git config user.email "build@users.noreply.github.com"
          git add -A
          # Reruns and no-op dispatches have nothing to commit.
          if git diff --cached --quiet; then
            echo "images unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "Deploy ${{ github.sha }}

          web and api built from ${{ github.repository }}@${{ github.sha }}."
          git push
