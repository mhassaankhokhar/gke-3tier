name: Terraform

# Applies terraform/envs/dev. bootstrap/ (CI's own identity) is never applied
# here; see docs/bootstrap.md.
#   pull request -> plan
#   push to main -> apply (environment: production)
on:
  pull_request:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      # First apply on an empty state only (see docs/bootstrap.md). A choice, so
      # the input can't inject other flags.
      target:
        description: "First apply on an empty state only: create the cluster first"
        type: choice
        options: ["", "module.gke"]
        default: ""

# All runs share one state lock, so they queue instead of failing with 412.
# No cancel-in-progress: cancelling an apply can leave state half-written.
concurrency:
  group: terraform-envs-dev
  cancel-in-progress: false

# id-token: needed for the OIDC token that federation exchanges for GCP credentials.
permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.13.3"
  # Repository variables, not committed: they identify a real account.
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  # envs/dev reads identity from bootstrap's state, so it needs the bucket name.
  TF_VAR_state_bucket: ${{ vars.TF_BACKEND_BUCKET }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Partial backend config: the bucket isn't committed.
      - name: Init
        working-directory: terraform/envs/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_BACKEND_BUCKET }}" \
            -backend-config="prefix=gke-3tier/envs/dev"

      - name: Plan
        id: plan
        working-directory: terraform/envs/dev
        # Empty except on dispatch; the saved plan carries -target into apply.
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: terraform plan ${TARGET:+-target="$TARGET"} -out=tfplan -input=false -no-color

      # Apply uses exactly the reviewed plan. Short retention: it holds resource detail.
      - uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: terraform/envs/dev/tfplan
          retention-days: 1

      - name: Plan summary
        working-directory: terraform/envs/dev
        run: |
          {
            echo '## Terraform plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    # PRs only plan.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: plan
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to gate the apply.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: terraform/envs/dev

      - name: Init
        working-directory: terraform/envs/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_BACKEND_BUCKET }}" \
            -backend-config="prefix=gke-3tier/envs/dev"

      - name: Apply
        working-directory: terraform/envs/dev
        run: terraform apply -input=false tfplan
