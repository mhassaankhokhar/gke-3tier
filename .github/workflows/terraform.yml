name: Terraform

# Infrastructure delivery for terraform/envs/dev — nothing here is created by hand.
#
# terraform/bootstrap is deliberately NOT applied by this workflow. It holds the
# service accounts and OIDC provider this job authenticates with, in a separate
# state; keeping it out means a destroy of infra cannot remove the pipeline's own
# credentials. See docs/bootstrap.md.
#
#   pull request -> plan, posted as a comment
#   push to main -> apply, behind the `production` environment gate
on:
  pull_request:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "plan (normal apply) or destroy (tear down envs/dev)"
        type: choice
        options: [plan, destroy]
        default: plan

# id-token is what lets GitHub mint the OIDC token federation trades for GCP
# credentials. Without it auth fails with a misleading "unable to get credentials"
# rather than a missing-permission error.
permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.13.3"
  # Values live in repository variables, not in the repo: the project id and the
  # state bucket name identify a real account.
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  # infra/ reads the identity from bootstrap's state rather than creating it, so
  # it needs to know where that state lives. github_owner/repo are not passed:
  # the OIDC provider they configure belongs to bootstrap, which CI never runs.
  TF_VAR_state_bucket: ${{ vars.TF_BACKEND_BUCKET }}

jobs:
  plan:
    name: Plan
    # Skipped for a destroy dispatch — see the destroy job below, which plans
    # and applies its own two steps directly rather than through this
    # artifact hand-off (a saved plan goes stale the moment state changes
    # underneath it, which the destroy job's first step always does).
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.action != 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Partial backend, same as locally — the bucket is supplied here rather
      # than committed.
      - name: Init
        working-directory: terraform/envs/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_BACKEND_BUCKET }}" \
            -backend-config="prefix=gke-3tier/envs/dev"

      - name: Plan
        id: plan
        working-directory: terraform/envs/dev
        run: terraform plan -out=tfplan -input=false -no-color

      # The plan pins exactly what apply will do, so apply cannot drift from what
      # was reviewed. Short retention: a plan carries resource detail and goes
      # stale within minutes anyway.
      - uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: terraform/envs/dev/tfplan
          retention-days: 1

      - name: Plan summary
        working-directory: terraform/envs/dev
        run: |
          {
            echo '## Terraform plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply
    # Only on main, and never for a destroy dispatch (see the destroy job).
    # A PR gets the plan for review; nothing is applied until it merges.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'destroy')
    needs: plan
    runs-on: ubuntu-latest
    # Add required reviewers to this environment to make the apply wait for an
    # approval — the recorded equivalent of a manual gate.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: tfplan
          path: terraform/envs/dev

      - name: Init
        working-directory: terraform/envs/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_BACKEND_BUCKET }}" \
            -backend-config="prefix=gke-3tier/envs/dev"

      - name: Apply
        working-directory: terraform/envs/dev
        run: terraform apply -input=false tfplan

  destroy:
    name: Destroy
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        working-directory: terraform/envs/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_BACKEND_BUCKET }}" \
            -backend-config="prefix=gke-3tier/envs/dev"

      # module.gke depends on module.network's VPC/subnet outputs, but nothing
      # references the NAT gateway or router — so a plain `terraform destroy`
      # is free to tear NAT down in parallel with module.argocd. The Tailscale
      # operator inside the cluster needs that NAT for egress to
      # controlplane.tailscale.com to clear its own Service finalizer; lose
      # NAT first and that finalizer hangs forever. A depends_on can't fix
      # this without a cycle (network -> argocd -> ... -> gke -> network), so
      # this destroys the in-cluster module first, while NAT and the cluster
      # are still up, then destroys everything else.
      - name: Destroy in-cluster resources first
        working-directory: terraform/envs/dev
        run: terraform apply -destroy -target=module.argocd -auto-approve -input=false -no-color

      - name: Destroy the rest
        working-directory: terraform/envs/dev
        run: terraform apply -destroy -auto-approve -input=false -no-color
