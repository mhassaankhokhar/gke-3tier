# Where External Secrets reads from (Secret Manager), authenticating with
# Workload Identity. No secret material.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStoreName }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.projectId }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.clusterLocation }}
          clusterName: {{ .Values.clusterName }}
          serviceAccountRef:
            name: {{ .Values.esoServiceAccount }}
            namespace: {{ .Values.esoNamespace }}
