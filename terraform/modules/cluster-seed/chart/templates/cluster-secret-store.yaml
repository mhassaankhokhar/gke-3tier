# Tells External Secrets where to read from, and as whom.
#
# Contains no secret material — only a project id and a service account name.
# Authentication is Workload Identity, so nothing here is a credential.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.secretStoreName }}
spec:
  provider:
    gcpsm:
      projectID: {{ .Values.projectId }}
      auth:
        workloadIdentity:
          clusterLocation: {{ .Values.clusterLocation }}
          clusterName: {{ .Values.clusterName }}
          serviceAccountRef:
            name: {{ .Values.esoServiceAccount }}
            namespace: {{ .Values.esoNamespace }}
