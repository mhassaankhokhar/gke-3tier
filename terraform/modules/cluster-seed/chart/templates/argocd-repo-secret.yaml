# ArgoCD's deploy key for the GitOps repo; must exist before ArgoCD can read Git.
# The key stays in Secret Manager. ArgoCD finds repo credentials by the
# secret-type label; without it: "authentication required: Repository not found".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-gitops-repo
  namespace: {{ .Values.argocdNamespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: argocd-gitops-repo
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        # Must match the Applications' repoURL exactly (string comparison).
        url: {{ .Values.repoUrl }}
        sshPrivateKey: "{{ `{{ .sshPrivateKey }}` }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: {{ .Values.sshKeySecretName }}
