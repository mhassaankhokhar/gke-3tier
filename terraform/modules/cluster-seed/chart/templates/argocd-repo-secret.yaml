# The deploy key ArgoCD reads the GitOps repository with.
#
# This is the object that cannot live in the GitOps repository, because ArgoCD
# needs it in order to read that repository at all. It is a pointer, not a
# secret: the key stays in Secret Manager and External Secrets fetches it.
#
# ArgoCD discovers repository credentials by LABEL. Without
# argocd.argoproj.io/secret-type: repository the Secret is ignored, and the
# symptom is "authentication required: Repository not found" — which reads as a
# missing repo rather than a missing label.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-gitops-repo
  namespace: {{ .Values.argocdNamespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: argocd-gitops-repo
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        # Must match the Applications' repoURL exactly — ArgoCD pairs credentials
        # to repositories by string comparison, so an https:// URL here would
        # never match a git@ URL there.
        url: {{ .Values.repoUrl }}
        sshPrivateKey: "{{ `{{ .sshPrivateKey }}` }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: {{ .Values.sshKeySecretName }}
