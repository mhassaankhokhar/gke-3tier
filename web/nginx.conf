server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Liveness: alive, and nothing else. The probes once pointed at the rendered
    # page, which called the api, which queried Postgres — so a slow database
    # made Kubernetes kill healthy pods, and the survivors inherited the load
    # and were killed in turn. 9 restarts in one load test.
    location = /healthz { access_log off; return 200 '{"status":"ok"}\n'; add_header Content-Type application/json; }
    location = /readyz  { access_log off; return 200 '{"status":"ok"}\n'; add_header Content-Type application/json; }

    # The API, proxied rather than called directly from the browser.
    #
    # This is why there is no API URL in the JavaScript bundle: the client asks
    # its own origin, so one build runs in any environment and there is no CORS
    # to configure. The address below is resolved inside the cluster.
    location /api/ {
        proxy_pass http://api.app.svc.cluster.local/api/;
        proxy_http_version 1.1;
        # Keep-alive to the upstream. Without it every proxied request opens a
        # new connection — the same mistake the api made with its Postgres pool,
        # which cost a replica most of its throughput.
        proxy_set_header Connection "";
        # The upstream's own name, NOT $host.
        #
        # Envoy routes outbound HTTP by the Host header. Passing the external
        # hostname through meant it matched no in-mesh service, so Envoy sent
        # the request to PassthroughCluster — outside the mesh and therefore
        # without mTLS — and api's sidecar, which is STRICT, terminated it. The
        # symptom was a 503 with `UC upstream_reset_before_response_started`,
        # which reads like the api being down rather than like a routing miss.
        proxy_set_header Host api.app.svc.cluster.local;
        # The original host is still forwarded, for anything that needs to know
        # what the client actually asked for.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Not cached here. The api decides what is cacheable and says so; a
        # second cache in front of it would serve stale totals moments after
        # someone adds a subscription.
        proxy_read_timeout 30s;
    }

    # Hashed filenames, so the content of a given URL never changes. A year is
    # safe precisely because a new build produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The SPA entry point. Never cached: it is the file that names the current
    # asset hashes, so a stale copy points the browser at a build that no longer
    # exists — the classic "hard refresh fixes it" deployment bug.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
