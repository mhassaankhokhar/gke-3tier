server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Liveness: this process only. Must not reach the api or Postgres.
    location = /healthz { access_log off; return 200 '{"status":"ok"}\n'; add_header Content-Type application/json; }
    location = /readyz  { access_log off; return 200 '{"status":"ok"}\n'; add_header Content-Type application/json; }

    # Same-origin proxy to the api: no API URL in the bundle and no CORS.
    location /api/ {
        proxy_pass http://api.app.svc.cluster.local/api/;
        proxy_http_version 1.1;
        # Keep-alive to the upstream.
        proxy_set_header Connection "";
        # The upstream's own name, not $host: Envoy routes by Host, and an external
        # host sends the request out of the mesh, where STRICT mTLS rejects it (503 UC).
        proxy_set_header Host api.app.svc.cluster.local;
        # The original host, for anything that needs it.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Not cached here; the api sets its own caching.
        proxy_read_timeout 30s;
    }

    # Hashed filenames, so a long cache is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cached: index.html names the current asset hashes.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
